# Linux packages. Build with `npm run release:linux` (scripts/release-linux.mjs): it fetches and
# verifies every bundled binary first (build/deps.lock.json), then runs this. docs/INSTALLER.md.
#   .deb      — primary: polkit action, CLI on PATH, socket group, driver dependencies
#   AppImage  — portable: the first "Install service" step copies what root needs out of it
appId: network.sentinel.devnet-dvpn
# productName is the install folder (/opt/devnet-dvpn). It must have NO space: Chromium's zygote
# cannot exec a path with one (FATAL zygote_host_impl_linux.cc:207, ddv-linux-1 2026-10-21).
# The name people see stays "Devnet dVPN" (package.json productName, desktop Name, data folder).
productName: devnet-dvpn
extraMetadata:
  productName: Devnet dVPN
copyright: Copyright (c) 2026 Devnet dVPN contributors
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
# resources/ = dvpnd + protocol binaries (bin/), root helper scripts (scripts/), daemon.proto
extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*'
extraFiles:
  - from: build/cli
    to: bin
  - from: build/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
  - from: build/licenses/dvpnd-THIRD-PARTY-NOTICES.txt
    to: dvpnd-THIRD-PARTY-NOTICES.txt
  - from: LICENSE
    to: LICENSE.txt
asarUnpack:
  - resources/**
# Arch: x64 and arm64, ONE per run. No `arch:` list on purpose: a config arch list overrides the
# CLI flag, and resources/bin holds one arch's binaries at a time (fetch-deps --arch). Without
# it electron-builder builds the host arch, or the one `--x64` / `--arm64` names
# (release-linux.mjs always passes it). ${arch} = each format's own word: deb amd64|arm64,
# rpm x86_64|aarch64, AppImage x86_64|arm64.
linux:
  target:
    - deb
    - rpm
    - AppImage
  executableName: devnet-dvpn-desktop
  icon: build/icon.png
  category: Network
  synopsis: Peer-to-peer dVPN on the Sentinel Solana devnet
  description: Pure peer-to-peer dVPN client for the Sentinel Solana devnet. Connect to any listed node or subscribe to any plan; no servers of ours, no API keys.
  maintainer: Sentinel-Bluebuilder <Sentinel-Bluebuilder@users.noreply.github.com>
  vendor: Devnet dVPN contributors
  desktop:
    Name: Devnet dVPN
    Comment: Peer-to-peer dVPN on the Sentinel Solana devnet
    Categories: Network;Security;
    StartupWMClass: Devnet dVPN
deb:
  artifactName: devnet-dvpn_${version}_${arch}.${ext}
  depends:
    - libgtk-3-0 | libgtk-3-0t64
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0 | libatspi2.0-0t64
    - libuuid1
    # Electron links these directly; GTK does not pull them on a stock server image
    # (clean Ubuntu 22.04 lacked libgbm.so.1, Debian 12 libasound.so.2)
    - libgbm1
    - libasound2t64 | libasound2
    - libdrm2
    - libxkbcommon0
    - libsecret-1-0
    - libsecret-tools
    - wireguard-tools
    - openvpn
    - nftables
    - iproute2
    - acl
    - pkexec | policykit-1
  recommends:
    - systemd-resolved
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
  fpm:
    - --before-remove=build/linux/before-remove.sh
# Fedora / RHEL family (dnf). Same scriptlets as the .deb: they read rpm's $1 count as well as
# dpkg's words. openvpn is only in EPEL on EL9, so it is a weak dependency here and
# install-deps.sh installs it (EPEL first); Fedora pulls it from its own repos.
rpm:
  artifactName: devnet-dvpn-${version}.${arch}.${ext}
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - libXtst
    - xdg-utils
    - at-spi2-core
    - libuuid
    - mesa-libgbm
    - alsa-lib
    - libdrm
    - libxkbcommon
    - libsecret
    - wireguard-tools
    - nftables
    - iproute
    - acl
    - polkit
    # semanage: the SELinux rule that lets systemd create the service socket (setup-daemon.sh)
    - policycoreutils-python-utils
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
  fpm:
    - --before-remove=build/linux/before-remove.sh
    - --rpm-tag=Recommends:openvpn
    # no systemd-resolved Recommends: on EL9 dnf installed the package (inactive) only to have it
    # removed again; without resolved the service uses DNS mode resolvconf
    # no /usr/lib/.build-id links: one of the bundled binaries has the same build id as a file
    # of the system's python3, and dnf refused the install as a file conflict (Rocky 9.8, 2026-10-22)
    - --rpm-rpmbuild-define=_build_id_links none
# Arch (pacman). Not in the default target list: build it on Arch with
# `release-linux.mjs --targets pacman` (needs bsdtar). fpm inlines each scriptlet into the
# .INSTALL function and pacman runs post_upgrade (not post_install) on an upgrade, so the
# install script is wired to both; the remove scriptlets read pacman's old-version argument.
# openvpn is in [extra]; systemd-resolved ships inside systemd.
pacman:
  artifactName: devnet-dvpn-${version}-${arch}.pkg.tar.zst
  depends:
    - gtk3
    - libnotify
    - nss
    - libxss
    - libxtst
    - xdg-utils
    - at-spi2-core
    - util-linux-libs
    - mesa
    - alsa-lib
    - libdrm
    - libxkbcommon
    - libsecret
    - wireguard-tools
    - openvpn
    - nftables
    - iproute2
    - acl
    - polkit
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
  fpm:
    - --before-remove=build/linux/before-remove.sh
    - --after-upgrade=build/linux/after-install.sh
appImage:
  artifactName: Devnet-dVPN-${version}-${arch}.${ext}
  license: build/license.txt
